<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:dc="http://purl.org/dc/elements/1.1/"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:cc="http://creativecommons.org/ns#"
   version="1.1"
   width="512"
   height="512"
   viewBox="0 0 512 512">
  <metadata>
    <rdf:RDF>
      <cc:Work rdf:about="">
        <dc:title>AltF4 brandmark</dc:title>
        <dc:rights>Copyright (C) 2026 AltF4 contributors. Licensed under GPL-3.0-or-later, the same license as the rest of this repository. Original artwork; not derived from any Vorssaint brand asset.</dc:rights>
      </cc:Work>
    </rdf:RDF>
  </metadata>

  <!-- "F4" drawn as plain rectangles rather than type, so it renders
       identically wherever it is rasterised and carries no font dependency.
       Bar thickness is a constant 56 across both glyphs. -->
  <g fill="#000000">

    <!-- F -->
    <rect x="80"  y="128" width="56"  height="256" />
    <rect x="80"  y="128" width="160" height="56"  />
    <rect x="80"  y="228" width="132" height="56"  />

    <!-- 4 -->
    <rect x="272" y="128" width="56"  height="156" />
    <rect x="272" y="228" width="160" height="56"  />
    <rect x="376" y="128" width="56"  height="256" />
  </g>
</svg>
