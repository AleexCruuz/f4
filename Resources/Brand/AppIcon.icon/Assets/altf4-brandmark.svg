<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   xmlns="http://www.w3.org/2000/svg"
   xmlns:dc="http://purl.org/dc/elements/1.1/"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
   xmlns:cc="http://creativecommons.org/ns#"
   version="1.1"
   width="512"
   height="512"
   viewBox="0 0 512 512">
  <metadata>
    <rdf:RDF>
      <cc:Work rdf:about="">
        <dc:title>AltF4 brandmark</dc:title>
        <dc:rights>Copyright (C) 2026 AltF4 contributors. Licensed under GPL-3.0-or-later, the same license as the rest of this repository. Original artwork; not derived from any Vorssaint brand asset.</dc:rights>
      </cc:Work>
    </rdf:RDF>
  </metadata>

  <!-- A keycap with its top-right corner open, and a stroke leaving through
       the gap. Geometric only, so it still reads at menu-bar size. -->
  <g fill="none"
     stroke="#000000"
     stroke-width="44"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- Keycap, open from the top-right corner round to the right edge. -->
    <path d="M 344 120
             H 152
             a 56 56 0 0 0 -56 56
             v 192
             a 56 56 0 0 0 56 56
             h 192
             a 56 56 0 0 0 56 -56
             v -80" />

    <!-- The stroke on its way out. -->
    <path d="M 264 248 L 424 88" />
    <path d="M 328 88 H 424 V 184" />
  </g>
</svg>
